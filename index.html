<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitBuddy - AI Workout Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Roboto', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1f2937, #111827);
    padding: 24px;
  }
  .card {
    background: rgba(255,255,255,0.97);
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.35);
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 20px;
    text-align: center;
    color: #111827;
  }
  label {
    display: block;
    font-weight: 500;
    margin-top: 14px;
    margin-bottom: 6px;
    color: #374151;
    font-size: 0.9rem;
  }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #d1d5db;
    font-size: 0.95rem;
    font-family: inherit;
  }
  input:focus, select:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
  }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  button:hover { background: #1d4ed8; }
  @media (max-width: 480px) {
    .card { padding: 24px; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>💪 FitBuddy - AI Workout Generator</h1>
    <form action="/generate-workout" method="post">
      <label for="username">Name</label>
      <input type="text" id="username" name="username" required>

      <label for="user_id">User ID</label>
      <input type="number" id="user_id" name="user_id" required>

      <label for="age">Age</label>
      <input type="number" id="age" name="age" required>

      <label for="weight">Weight (kg)</label>
      <input type="number" step="0.1" id="weight" name="weight" required>

      <label for="goal">Fitness Goal</label>
      <input type="text" id="goal" name="goal" placeholder="e.g., weight loss, muscle gain" required>

      <label for="intensity">Workout Intensity</label>
      <select id="intensity" name="intensity" required>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>

      <button type="submit">Generate Plan</button>
    </form>
  </div>
</body>
</html>
